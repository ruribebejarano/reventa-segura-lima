<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Reventa Verificada</title>
    <meta name="description" content="Compra entradas de reventa verificadas, con tu dinero protegido hasta que ingreses." />
    <meta name="theme-color" content="#2A9D8F" />

    <!-- Íconos -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Vista previa del link (WhatsApp, Facebook, Telegram, X).
      WhatsApp necesita URLs absolutas: si el dominio de Vercel es otro, cámbialo aquí
      (o define una variable y regenera con: node scripts/generar-imagenes.mjs).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reventa Verificada" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="Reventa Verificada" />
    <meta property="og:description" content="Compra entradas de reventa verificadas, con tu dinero protegido hasta que ingreses." />
    <meta property="og:url" content="https://reventa-segura-lima.vercel.app/" />
    <meta property="og:image" content="https://reventa-segura-lima.vercel.app/og.png" />
    <meta property="og:image:secure_url" content="https://reventa-segura-lima.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reventa Verificada: entradas de reventa verificadas con la ticketera oficial" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reventa Verificada" />
    <meta name="twitter:description" content="Compra entradas de reventa verificadas, con tu dinero protegido hasta que ingreses." />
    <meta name="twitter:image" content="https://reventa-segura-lima.vercel.app/og.png" />

    <!-- Reset recomendado por react-native-web -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Mismo fondo que el marco de la app: evita un destello blanco al cargar */
        background-color: #e9eef3;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar Reventa Verificada.</noscript>
    <div id="root"></div>
  </body>
</html>
